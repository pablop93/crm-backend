spring:
  application:
    name: crm
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:crm}
    username: ${POSTGRES_USER:crm}
    password: ${POSTGRES_PASSWORD:crm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mongodb:
    uri: mongodb://${MONGO_USER:crm}:${MONGO_PASSWORD:crm}@localhost:27017/${MONGO_DB:crm}?authSource=admin

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html